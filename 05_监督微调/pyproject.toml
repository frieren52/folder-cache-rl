[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-cache-actor"
version = "0.1.0"
description = "Supervised actor and retrieval state for folder-cache prediction"
requires-python = ">=3.10,<3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

